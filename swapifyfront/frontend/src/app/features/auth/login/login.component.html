<div class="flex h-screen w-full">
  <!-- Panel izquierdo con gradiente -->
  <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-green-400 to-green-600 justify-center items-center relative overflow-hidden">
    <div class="absolute w-full h-full">
      <div class="absolute transform rotate-45 bg-green-300 opacity-30 w-96 h-96 -top-20 -left-20"></div>
      <div class="absolute transform rotate-45 bg-green-300 opacity-30 w-96 h-96 bottom-20 right-20"></div>
    </div>
    <div class="z-10 text-center">
      <p class="text-white">¿Eres nuevo?, crea tu cuenta aquí!</p>
      <br>
      <button class="bg-white text-gray-600 font-semibold py-3 px-12 rounded-full shadow-lg hover:bg-gray-200 transition-colors" (click)="irARegistro()">
        SIGN IN
      </button>
    </div>
  </div>

  <!-- Panel derecho con formulario -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center px-6 md:px-16 bg-white">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <div class="text-center">
          <svg class="w-16 h-16 mx-auto" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 30L70 30L70 70L30 70L30 30Z" stroke="#FF6B81" stroke-width="8" stroke-linejoin="round"/>
            <path d="M20 20L60 20L60 60L20 60L20 20Z" stroke="#FF6B81" stroke-width="8" stroke-linejoin="round"/>
          </svg>
          <h1 class="text-3xl font-bold text-green-500 mt-2">LOGIN</h1>
          <!-- Mensajes -->
          <div *ngIf="error" class="text-red-500 text-sm mt-2">{{ error }}</div>
          <div *ngIf="successMessage" class="text-green-500 text-sm mt-2">{{ successMessage }}</div>
        </div>
      </div>

      <!-- Formulario -->
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
          </div>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            class="w-full pl-10 pr-3 py-2 border-b border-gray-300 focus:outline-none focus:border-pink-500"
            placeholder="Email"
            required
          >
        </div>

        <!-- Password -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
          </div>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            class="w-full pl-10 pr-3 py-2 border-b border-gray-300 focus:outline-none focus:border-pink-500"
            placeholder="Password"
            required
          >
        </div>

        <!-- Forgot Password -->
        <div class="text-right">
          <a class="text-pink-500 text-sm cursor-pointer hover:underline">Forgot Password?</a>
        </div>

        <!-- Login Button -->
        <div class="flex justify-end">
          <button
            type="submit"
            class="bg-green-500 hover:bg-green-600 text-white font-medium py-3 px-12 rounded-full focus:outline-none"
          >
            LOGIN
          </button>
        </div>
      </form>

      <!-- Social Login -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <div class="flex justify-center space-x-4">
          <button class="flex items-center justify-center">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
          </button>
          <button class="flex items-center justify-center">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
