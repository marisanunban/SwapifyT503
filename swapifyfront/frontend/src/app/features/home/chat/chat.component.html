<div class="flex h-screen bg-gray-100">
  <!-- Main chat area -->
  <div class="flex-1 flex flex-col">
    <!-- Chat header -->
    <div class="bg-white border-b p-4 flex items-center justify-between">
      <div *ngIf="otherUser" class="flex items-center">
        <img [src]="otherUser.avatar || '/placeholder.svg'" alt="Chat" class="w-10 h-10 rounded-full object-cover">
        <div class="ml-3">
          <div class="font-semibold">{{ otherUser.name }}</div>
          <div class="text-xs text-gray-500">{{ otherUser.status || 'Desconocido' }}</div>
        </div>
      </div>
    </div>

    <!-- Chat messages -->
    <div class="flex-1 overflow-y-auto p-4 bg-gray-100">
      <div *ngIf="messages.length === 0" class="text-center text-gray-500">
        <p>No hay mensajes en esta conversación.</p>
      </div>
      <div *ngFor="let message of messages" class="space-y-4">
        <div class="flex" [ngClass]="{'justify-end': message.senderId === currentUser.id, 'justify-start': message.senderId !== currentUser.id}">
          <div class="px-4 py-2 rounded-lg mx-2" 
              [ngClass]="{'bg-indigo-800 text-white': message.senderId === currentUser.id, 'bg-white text-gray-800': message.senderId !== currentUser.id}">
            <div class="text-sm">{{ message.text }}</div>
            <div class="text-xs mt-1 text-right text-gray-500">{{ message.time }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Message input -->
    <div class="bg-white p-4 border-t">
      <div class="flex items-center">
        <input 
          type="text" 
          [(ngModel)]="newMessage"
          placeholder="Escribe un mensaje..." 
          class="flex-1 border border-gray-300 rounded-l-md py-2 px-4 focus:outline-none focus:ring-1 focus:ring-indigo-500"
          (keyup.enter)="sendMessage()">
        <button (click)="sendMessage()" class="bg-indigo-600 text-white p-2 rounded-r-md hover:bg-indigo-700">
          Enviar
        </button>
      </div>
    </div>
  </div>
</div>
