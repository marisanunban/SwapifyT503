<div class="container mx-auto p-4 max-w-3xl">
    <div class="bg-white rounded-lg shadow-md p-6">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Añadir nuevo producto</h1>
        <button class="text-green-600 hover:text-green-700 font-medium flex items-center" >
          <i class="bi bi-arrow-left mr-1"></i> Volver
        </button>
      </div>
  
      <form FormBuilder="productForm">
        <!-- Información básica -->
        <div class="mb-6">
          <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Información básica</h2>
          
          <div class="mb-4">
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Título del producto *</label>
            <input 
              type="text" recquired
              id="title" 
              formControlName="title"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="Ej: Camiseta de algodón"
            >
          </div>
          
          <div class="mb-4">
            <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
            <select 
              id="category" 
              formControlName="category" recquired
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
            >
              <option value="" disabled selected>Selecciona una categoría</option>
              <option value="Electrónica">Electrónica</option>
            </select>
          </div>
          
          <div class="mb-4">
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
            <textarea 
              id="description" 
              formControlName="description" recquired
              rows="4"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="Describe tu producto, incluye detalles sobre el estado, características, etc."
            ></textarea>
          </div>
        </div>
        
        <!-- Precio y condiciones -->
        <div class="mb-6">
          <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Precio y condiciones</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="mb-4">
              <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Precio (€) *</label>
              <div class="relative">
                <input 
                  type="number" 
                  id="price" 
                  formControlName="price"
                  class="w-full pl-7 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
                  placeholder="0.00"
                  step="0.01"
                  min="0"
                >
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <span class="text-gray-500">€</span>
                </div>
              </div>
              <div *ngIf="submitted && f['price'].errors" class="mt-1 text-red-500 text-sm">
                <div *ngIf="f['price'].errors['required']">El precio es obligatorio</div>
                <div *ngIf="f['price'].errors['min']">El precio debe ser mayor que 0</div>
              </div>
            </div>
            
            <div class="mb-4">
              <label for="condition" class="block text-sm font-medium text-gray-700 mb-1">Estado *</label>
              <select 
                id="condition" 
                formControlName="condition"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
              >
                <option value="" disabled selected>Selecciona el estado</option>
                <option value="new">Nuevo</option>
                <option value="like_new">Como nuevo</option>
                <option value="good">Buen estado</option>
                <option value="fair">Estado aceptable</option>
                <option value="poor">Necesita reparación</option>
              </select>
              <div *ngIf="submitted && f['condition'].errors" class="mt-1 text-red-500 text-sm">
                <div *ngIf="f['condition'].errors['required']">El estado es obligatorio</div>
              </div>
            </div>
          </div>
          
          <div class="mb-4">
            <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Etiquetas (separadas por comas)</label>
            <input 
              type="text" 
              id="tags" 
              formControlName="tags"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="Ej: verano, casual, algodón"
            >
          </div>
        </div>
        
        <!-- Ubicación -->
        <div class="mb-6">
          <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Ubicación</h2>
          
          <div class="mb-4">
            <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Ciudad *</label>
            <input 
              type="text" 
              id="location" 
              formControlName="location"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500"
              placeholder="Ej: Madrid"
            >
            <div *ngIf="submitted && f['location'].errors" class="mt-1 text-red-500 text-sm">
              <div *ngIf="f['location'].errors['required']">La ubicación es obligatoria</div>
            </div>
          </div>
        </div>
        
        <!-- Botones de acción -->
        <div class="flex justify-end space-x-3 mt-8">
          <button 
            type="button" 
            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50"
            
          >
            Cancelar
          </button>
          <button 
            type="submit" (ngSubmit)="createProduct()"
            class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
          >
            Publicar producto
          </button>
        </div>
      </form>
    </div>
  </div>
