<div class="container mx-auto p-4 max-w-3xl" *ngIf="product">
  <div class="bg-white rounded-lg shadow-md p-6">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-800">{{ product.title }}</h1>
      <button 
        class="text-green-600 hover:text-green-700 font-medium flex items-center"
        (click)="goToHome()"
      >
        Volver
      </button>
    </div>

    <!-- Imágenes del producto -->
    <div class="mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Imágenes</h2>
      <div class="flex flex-wrap gap-4">
        <img 
          *ngFor="let image of product.imageUrl" 
          [src]="image || 'assets/default-product.png'" 
          alt="Imagen del producto" 
          class="w-48 h-48 object-cover rounded-md border border-gray-300"
        >
      </div>
    </div>

    <!-- Detalles del producto -->
    <div class="mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Detalles</h2>
      <p class="text-gray-600 mb-4">{{ product.description || 'Sin descripción' }}</p>
      <p class="font-bold text-teal-600 mb-4">Precio: {{ product.price }} swapicoins</p>
      <p class="text-sm text-gray-500">Categoría: {{ product.category || 'Sin categoría' }}</p>
    </div>

    <!-- Propietario del producto -->
    <div class="mb-6" *ngIf="owner">
      <h2 class="text-lg font-semibold text-gray-700 mb-3 border-b pb-2">Propietario</h2>
      <p class="text-gray-600 mb-2">Vendido por: {{ owner.nickname || 'Usuario desconocido' }}</p>
      <button 
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        (click)="goToOwnerProfile()"
      >
        Ver perfil del propietario
      </button>
    </div>

    <!-- Botón para volver -->
    <div class="flex justify-end">
      <button 
        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
        (click)="goToHome()"
      >
        Volver
      </button>
    </div>
  </div>
</div>

<div *ngIf="!product" class="container mx-auto p-4 text-center">
  <p class="text-gray-600">Cargando detalles del producto...</p>
</div>
